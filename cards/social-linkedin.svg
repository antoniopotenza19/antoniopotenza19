<svg xmlns="http://www.w3.org/2000/svg" width="54" height="54" viewBox="0 0 54 54" role="img" aria-labelledby="title desc">
<title id="title">LinkedIn</title><desc id="desc">Open LinkedIn</desc>
<style>@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.bob{animation:bob 3.6s ease-in-out infinite}
.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.pop{animation:pop .35s both;transform-box:fill-box;transform-origin:center}
@media(prefers-reduced-motion:reduce){.rise,.pop,.bob{animation:none!important}.scan{display:none}}
</style>
<rect x="1" y="1" width="52" height="52" rx="14" fill="#f3f3f1" />
<g fill="none" stroke="#0a66c2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<rect x="14" y="14" width="26" height="26" rx="3" fill="#0a66c2" stroke="none"/><path d="M21 24V34M26.5 34V24M26.5 28C26.5 22.5 34 22.5 34 28V34" stroke="#fff" stroke-width="2.6"/><circle cx="21" cy="20" r="1.5" fill="#fff" stroke="none"/>
</g>
</svg>
