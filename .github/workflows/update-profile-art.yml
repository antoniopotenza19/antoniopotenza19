name: Build profile art

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - profile.json
      - assets/tool-icons/**
      - .github/workflows/update-profile-art.yml

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Render profile cards
        run: |
          python scripts/render_cards.py
          python -c "import xml.etree.ElementTree as E; from pathlib import Path; [E.parse(p) for p in Path('cards').glob('*.svg')]"
      - name: Commit updated art
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cards/
          if ! git diff --cached --quiet; then
            git commit -m 'chore: rebuild profile art [skip ci]'
            git push
          fi
